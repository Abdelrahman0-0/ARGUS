name: Build ARGUS_Setup.exe

# Runs when you publish a Release on GitHub (Releases > Draft a new release > Publish).
# It builds ARGUS_Setup.exe on a Windows machine and attaches it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match version.py
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}".TrimStart("v","V")
          $line = Get-Content version.py | Select-String 'APP_VERSION\s*=\s*"([^"]+)"'
          $ver = $line.Matches[0].Groups[1].Value
          Write-Host "release tag = $tag, version.py = $ver"
          if ($tag -ne $ver) {
            Write-Error "The release tag ($tag) does not match APP_VERSION in version.py ($ver). Edit version.py, then publish the release again."
            exit 1
          }

      - name: Build ARGUS.exe and ARGUS_Setup.exe
        shell: cmd
        run: call make_installer.bat nopause

      - name: Check the installer exists
        shell: pwsh
        run: |
          if (-not (Test-Path ARGUS_Setup.exe)) {
            Write-Host "---- installer_build_log.txt (tail) ----"
            if (Test-Path installer_build_log.txt) { Get-Content installer_build_log.txt -Tail 40 }
            Write-Host "---- build_log.txt (tail) ----"
            if (Test-Path build_log.txt) { Get-Content build_log.txt -Tail 40 }
            Write-Error "ARGUS_Setup.exe was not built."
            exit 1
          }
          Get-Item ARGUS_Setup.exe | Format-List Name, Length

      - name: Attach it to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ARGUS_Setup.exe --clobber
